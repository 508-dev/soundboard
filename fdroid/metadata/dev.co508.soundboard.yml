# App metadata for the SELF-HOSTED F-Droid repository (gh-pages / GitHub Pages).
#
# This repo distributes APKs we build and sign ourselves, so there is no
# `Builds:` section — fdroidserver reads the version straight out of each APK it
# finds in `repo/`. The name, summary, description, changelogs, and screenshots
# all come from `fastlane/metadata/android/`, which
# `scripts/fdroid-publish.sh` copies into `metadata/dev.co508.soundboard/`.
# Keep store copy there, not here, so Play and both F-Droid paths stay in sync.
#
# The f-droid.org submission is a different file with different requirements:
# fdroid/fdroiddata/dev.co508.soundboard.yml. See docs/deployment.md.

