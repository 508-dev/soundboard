[project]
name = "example-api"
version = "0.1.0"
description = "Template FastAPI service."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "example-shared",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.14.2,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
api = "example_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
