# Optional pnpm setup for JavaScript workspaces that prefer pnpm.
# The root TypeScript example shows Bun first, but pnpm is first-class too.
packages:
  - "stacks/typescript"

# Seven days, in minutes. pnpm v10.16+ supports this setting here.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@types/node"
  - "typescript"
